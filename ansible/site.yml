# Main playbook for kubeadm cluster setup
# Production-grade Kubernetes cluster with Calico CNI

---
- name: Install common prerequisites on all nodes
  hosts: all
  become: yes
  roles:
    - common
  tags: ['common', 'prerequisites']

- name: Install containerd on all nodes
  hosts: all
  become: yes
  roles:
    - containerd
  tags: ['containerd', 'runtime']

- name: Install Kubernetes packages on all nodes
  hosts: all
  become: yes
  roles:
    - kubernetes
  tags: ['kubernetes', 'k8s']

- name: Initialize control plane
  hosts: control_plane
  become: yes
  roles:
    - control-plane
  tags: ['control-plane', 'init']

- name: Install Calico CNI
  hosts: control_plane
  become: yes
  roles:
    - calico
  tags: ['calico', 'cni']

- name: Join worker nodes to cluster
  hosts: workers
  become: yes
  roles:
    - worker
  tags: ['worker', 'join']

- name: Verify cluster health
  hosts: control_plane
  become: yes
  tasks:
    - name: Get cluster nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: cluster_nodes
      changed_when: false
      tags: ['verify']

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "{{ cluster_nodes.stdout_lines }}"
      tags: ['verify']

    - name: Get cluster pods
      ansible.builtin.command: kubectl get pods --all-namespaces -o wide
      register: cluster_pods
      changed_when: false
      tags: ['verify']

    - name: Display cluster pods
      ansible.builtin.debug:
        msg: "{{ cluster_pods.stdout_lines }}"
      tags: ['verify']

    - name: Get cluster component statuses
      ansible.builtin.command: kubectl get cs
      register: component_status
      changed_when: false
      tags: ['verify']

    - name: Display component statuses
      ansible.builtin.debug:
        msg: "{{ component_status.stdout_lines }}"
      tags: ['verify']
  tags: ['verify', 'health']