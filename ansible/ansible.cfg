# Ansible configuration for kubeadm cluster setup
# Production-grade configuration with Calico CNI

[defaults]
# Inventory
inventory = ./inventory/hosts.ini

# SSH settings
host_key_checking = False
timeout = 30
gathering = smart
fact_caching = memory
fact_caching_timeout = 86400

# Output
stdout_callback = default
callbacks_enabled = profile_tasks
result_format = yaml

# Retry files
retry_files_enabled = False

# Roles path
roles_path = ./roles:/usr/share/ansible/roles

# Collections path
collections_path = ./collections:/usr/share/ansible/collections

# Log path
log_path = ./logs/ansible.log

# Remote user
remote_user = ubuntu

# Become settings
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# Interpreter discovery
interpreter_python = auto_silent

# Diff mode
diff = True

# Error handling
force_handlers = True

# Performance
forks = 5
poll_interval = 15

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection settings
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

[persistent_connection]
connect_timeout = 30
command_timeout = 300