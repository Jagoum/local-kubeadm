# Kubernetes installation role
# Production-grade setup for kubeadm cluster

---
- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: ['kubernetes', 'repo']

- name: Download Kubernetes GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
  tags: ['kubernetes', 'repo']

- name: Convert GPG key to binary format
  ansible.builtin.command: >
    gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      /etc/apt/keyrings/kubernetes-apt-keyring.asc
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  tags: ['kubernetes', 'repo']

- name: Add Kubernetes repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
    state: present
    filename: kubernetes
    update_cache: yes
  tags: ['kubernetes', 'repo']

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_full_version }}-1.1"
      - "kubeadm={{ kubernetes_full_version }}-1.1"
      - "kubectl={{ kubernetes_full_version }}-1.1"
    state: present
    update_cache: yes
    allow_unauthenticated: no
  tags: ['kubernetes', 'packages']

- name: Hold Kubernetes packages at current version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  tags: ['kubernetes', 'packages']

- name: Start and enable kubelet
  ansible.builtin.service:
    name: kubelet
    state: started
    enabled: yes
  tags: ['kubernetes', 'service']

- name: Create kubeadm configuration directory
  ansible.builtin.file:
    path: /etc/kubeadm
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ['kubernetes', 'config']

- name: Configure kubelet for production
  ansible.builtin.copy:
    content: |
      # Kubelet configuration for production
      KUBELET_EXTRA_ARGS=--cgroup-driver=systemd --resolv-conf=/run/systemd/resolve/resolv.conf
    dest: /etc/default/kubelet
    owner: root
    group: root
    mode: '0644'
  notify: Restart kubelet
  tags: ['kubernetes', 'config']

- name: Restart kubelet to apply configuration
  ansible.builtin.service:
    name: kubelet
    state: restarted
  tags: ['kubernetes', 'service']