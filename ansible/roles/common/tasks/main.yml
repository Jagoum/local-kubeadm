# Common prerequisites role for all nodes
# Production-grade setup for Kubernetes cluster

---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: ['always']

- name: Install required packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - apt-transport-https
    - ca-certificates
    - curl
    - gnupg
    - lsb-release
    - software-properties-common
    - jq
    - htop
    - vim
    - net-tools
    - conntrack
    - socat
    - ebtables
    - ethtool
    - python3-kubernetes
    - open-iscsi
    - nfs-common
  tags: ['packages']

- name: Start and enable iscsid
  ansible.builtin.service:
    name: iscsid
    state: started
    enabled: yes
  tags: ['iscsi']

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  tags: ['kernel']

- name: Ensure kernel modules are loaded at boot
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: '0644'
  tags: ['kernel']

- name: Configure sysctl parameters for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }
    - { name: 'net.ipv4.conf.all.forwarding', value: '1' }
    - { name: 'net.ipv4.conf.default.forwarding', value: '1' }
    - { name: 'net.core.somaxconn', value: '32768' }
    - { name: 'net.ipv4.tcp_max_syn_backlog', value: '32768' }
    - { name: 'net.core.netdev_max_backlog', value: '32768' }
    - { name: 'vm.max_map_count', value: '262144' }
    - { name: 'vm.swappiness', value: '10' }
    - { name: 'fs.file-max', value: '2097152' }
    - { name: 'fs.inotify.max_user_instances', value: '8192' }
    - { name: 'fs.inotify.max_user_watches', value: '524288' }
  tags: ['sysctl']

- name: Configure system limits
  ansible.builtin.copy:
    content: |
      * soft nofile 65536
      * hard nofile 65536
      * soft nproc 65536
      * hard nproc 65536
      root soft nofile 65536
      root hard nofile 65536
    dest: /etc/security/limits.d/99-kubernetes.conf
    owner: root
    group: root
    mode: '0644'
  tags: ['limits']

- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: true
  tags: ['swap']

- name: Remove swap from /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: ' swap '
    state: absent
    backup: yes
  tags: ['swap']

- name: Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/containerd
    - /etc/kubernetes
    - /var/lib/kubernetes
  tags: ['directories']

- name: Set timezone
  community.general.timezone:
    name: UTC
  tags: ['timezone']

- name: Synchronize time with chrony
  ansible.builtin.apt:
    name: chrony
    state: present
  tags: ['time']

- name: Start and enable chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: yes
  tags: ['time']