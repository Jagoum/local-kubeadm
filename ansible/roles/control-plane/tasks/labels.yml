# OpenStack specific node labeling
---
- name: Label first worker as openstack-control and infra
  ansible.builtin.command: >
    kubectl label node {{ groups['workers'][0] }}
    node.home.lab/dedicated=openstack-control
    openstack-control-node=true
    infra-node=true
    --overwrite
  when: groups['workers'] | length >= 1
  changed_when: true
  tags: ['labels', 'openstack']

- name: Label second worker as openstack-compute
  ansible.builtin.command: >
    kubectl label node {{ groups['workers'][1] }}
    node.home.lab/dedicated=openstack-compute
    openstack-compute-node=true
    --overwrite
  when: groups['workers'] | length >= 2
  changed_when: true
  tags: ['labels', 'openstack']
