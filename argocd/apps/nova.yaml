apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: openstack
  source:
    repoURL: https://github.com/skyengpro/openstack-deployment.git
    targetRevision: feat/deploy-neutron-agent-on-bare-metal-using-containers
    path: charts/nova-wrapper
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: "jobs.db_init.enabled"
          value: "true"
        - name: "jobs.db_sync.enabled"
          value: "true"
        - name: "jobs.ks_user.enabled"
          value: "true"
        - name: "jobs.ks_service.enabled"
          value: "true"
        - name: "jobs.ks_endpoints.enabled"
          value: "true"
        - name: "jobs.cell_setup.enabled"
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
