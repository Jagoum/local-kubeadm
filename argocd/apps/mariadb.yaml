apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: openstack
  source:
    repoURL: https://github.com/skyengpro/openstack-deployment.git
    targetRevision: feat/deploy-neutron-agent-on-bare-metal-using-containers
    path: charts/mariadb-wrapper
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: "pod.replicas.server"
          value: "3"
        # Add pod anti-affinity to spread pods across nodes
        - name: "pod.affinity.anti_affinity"
          value: "required"
        # Increase termination grace period to allow clean volume detachment
        - name: "pod.lifecycle.termination_grace_period.server"
          value: "60"
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
